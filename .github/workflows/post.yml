# Formline XI: checks every hour; posts our 3 teams ~30 hours before each FPL
# deadline, a reminder ~2 hours before, and a review after each gameweek (each once).
name: FPL group posts
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post this week's 3 teams now"
        type: boolean
        default: false
      reminder:
        description: "Post the deadline reminder now"
        type: boolean
        default: false
      dry_run:
        description: "Only print the posts (don't send)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: fpl-group-bot
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post what is due
        run: python post.py ${{ inputs.force && '--force' || '' }} ${{ inputs.reminder && '--reminder' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Remember what was posted
        if: always()
        run: |
          git config user.name "fpl-group-bot"
          git config user.email "fpl-group-bot@users.noreply.github.com"
          git add data/state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to save"; exit 0; fi
          git commit -m "Update post state [skip ci]"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
